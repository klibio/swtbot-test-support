name: 'CI Build'

on:
  push:
    branches: [ 'main' ]
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release.yml'
      - '.github/release.yml'
      - '.github/scripts/ci-build.sh'
      - '.github/scripts/ci-publish.sh'
      - '.github/scripts/sonatype-upload.sh'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release.yml'
      - '.github/release.yml'
      - '.github/scripts/ci-build.sh'
      - '.github/scripts/ci-publish.sh'
      - '.github/scripts/sonatype-upload.sh'
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle_version:
        description: 'OSGi bundle version derived from release tag'
        required: false
        type: string
        default: ''
      maven_version:
        description: 'Maven version derived from release tag'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Git release tag'
        required: false
        type: string
        default: ''

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: Build JDK21 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest', 'macos-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        id: build
        run: ./.github/scripts/ci-build.sh
        env:
          RELEASE_BUNDLE_VERSION: ${{ inputs.bundle_version || '' }}
          RELEASE_MAVEN_VERSION: ${{ inputs.maven_version || '' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
      - name: Upload Test Reports
        if: ${{ always() && ((steps.build.outcome == 'success') || (steps.build.outcome == 'failure')) }}
        uses: actions/upload-artifact@v4
        with:
          name: Build_JDK21_${{ matrix.os }}-test-reports
          if-no-files-found: warn
          path: |
            */generated/test-reports/**/TEST-*.xml
