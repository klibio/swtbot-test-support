name: Release

# Tag-driven release: git tag -s v0.1.0 -m "SWTBot Test Support 0.1.0"

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      bundle_version: ${{ steps.meta.outputs.bundle_version }}
      maven_version: ${{ steps.meta.outputs.maven_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Derive versions from tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::Tag '${tag}' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          base_version="${BASH_REMATCH[1]}"
          qualifier="${BASH_REMATCH[3]:-}"
          if [[ "${qualifier^^}" == "SNAPSHOT" || "${qualifier^^}" == *-SNAPSHOT ]]; then
            echo "::error::SNAPSHOT versions must use the main snapshot workflow, not a release tag"
            exit 1
          fi
          maven_version="${base_version}"
          bundle_version="${base_version}"
          prerelease=false
          if [[ -n "${qualifier}" ]]; then
            maven_version="${base_version}-${qualifier}"
            bundle_version="${base_version}.${qualifier//./-}"
            prerelease=true
          fi
          {
            echo "tag=${tag}"
            echo "bundle_version=${bundle_version}"
            echo "maven_version=${maven_version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag=${tag} bundle_version=${bundle_version} maven_version=${maven_version} prerelease=${prerelease}"
      - name: Require tag commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/main"
            exit 1
          fi

  ci:
    name: CI at tagged version
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      bundle_version: ${{ needs.guard.outputs.bundle_version }}
      maven_version: ${{ needs.guard.outputs.maven_version }}
      release_tag: ${{ needs.guard.outputs.tag }}

  release:
    name: Publish Maven and create GitHub Release
    needs: [ guard, ci ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_BUNDLE_VERSION: ${{ needs.guard.outputs.bundle_version }}
      RELEASE_MAVEN_VERSION: ${{ needs.guard.outputs.maven_version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Publish to Sonatype Central
        id: publish
        run: ./.github/scripts/ci-publish.sh
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SONATYPE_BEARER: ${{ secrets.SONATYPE_BEARER }}
          SONATYPE_PUBLISHING_TYPE: USER_MANAGED
      - name: Assemble GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ( cd dist/bundles && zip -q -r "${GITHUB_WORKSPACE}/release-assets/swtbot-test-support-maven-${RELEASE_MAVEN_VERSION}.zip" . )
          ( cd release-assets && sha256sum -- * > SHA256SUMS.txt )
          ls -la release-assets
          cat release-assets/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "SWTBot Test Support ${RELEASE_TAG}" --generate-notes)
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" "${flags[@]}" release-assets/*
          fi